<div class="empty-state">
  <i class="empty-state__icon" [class]="icon()" aria-hidden="true"></i>
  <h2 class="empty-state__title">{{ title() }}</h2>
  @if (message()) {
    <p class="empty-state__message">{{ message() }}</p>
  }
  <div class="empty-state__actions">
    <ng-content />
  </div>
</div>
